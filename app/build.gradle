plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
    alias libs.plugins.kotlin.parcelize
    alias libs.plugins.room
    alias libs.plugins.ksp
}

static def releaseTime() {
    return new Date().format("yy.MMddHH", TimeZone.getTimeZone("GMT+8"))
}

def name = "legado"
def version = "3." + releaseTime()
def gitCommits = Integer.parseInt('git rev-list HEAD --count'.execute().text.trim())

// 目标架构：默认只出 arm64-v8a（.so 只保留 renderscript 的 503KB；libarchive 已移除）
// 需要其它架构时用 -Pabi=x86_64 或 -Pabi=arm64-v8a,armeabi-v7a 覆盖
def targetAbis = (project.findProperty("abi") ?: "arm64-v8a").toString().split(",")*.trim()

// 仓库内置的公开签名密钥（keystore/legado-release.jks，密码 123456 / alias legado）：
// 公开提交，供 CI 与任何人构建出可互相覆盖安装的 APK。
// 若在 local.properties / ~/.gradle/gradle.properties 里定义了 RELEASE_STORE_FILE，则优先使用你自己的密钥。
def bundledStoreFile = rootProject.file("keystore/legado-release.jks")
def hasCustomStore = project.hasProperty("RELEASE_STORE_FILE")
def useBundledStore = !hasCustomStore && bundledStoreFile.exists()
def signWithStore = hasCustomStore || useBundledStore

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (signWithStore) {
            myConfig {
                if (hasCustomStore) {
                    storeFile file(RELEASE_STORE_FILE)
                    storePassword RELEASE_STORE_PASSWORD
                    keyAlias RELEASE_KEY_ALIAS
                    keyPassword RELEASE_KEY_PASSWORD
                } else {
                    // 内置公开密钥（见文件顶部说明）
                    storeFile bundledStoreFile
                    storePassword "123456"
                    keyAlias "legado"
                    keyPassword "123456"
                }
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "com.legado.app"
        minSdk 23
        targetSdk 36
        versionCode 30000 + gitCommits
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        // 单架构：只打包 arm64-v8a 的 .so（libarchive + renderscript-toolkit）
        ndk {
            abiFilters += targetAbis
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    // 语言资源白名单：只打包中文（默认 values/ + values-zh / zh-rTW / zh-rHK）。
    // 注意：AGP 8.13.2 会把这里的值原样传给 aapt2 的 -c 参数，所以必须用 Android 资源限定符写法
    // （zh-rTW / zh-rHK）。写成 BCP-47 的 zh-TW 会直接报 "AAPT: error: invalid config 'zh-TW' for -c option"。
    // 其余 ja/es/pt/vi 的源文件保留在仓库，只是不参与打包；需要时把码加回列表即可。
    androidResources {
        localeFilters += ["zh", "zh-rTW", "zh-rHK"]
    }
    // 不把依赖元数据块打进 APK/AAB（省几 KB；若上架 Google Play 会失去「SDK 洞察」数据）
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (signWithStore) {
                signingConfig signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (signWithStore) {
                signingConfig signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix 'debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def flavor = variant.productFlavors[0].name
            outputFileName = "${name}_${flavor}_${defaultConfig.versionName}.apk"
        }
    }


    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

